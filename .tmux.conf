bind r source-file ~/.tmux.conf
bind I run-shell "~/.tmux/plugins/tpm/scripts/install_plugins.sh"

set -g prefix C-a
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macos / darwin style

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n S-Left resize-pane -L 5    # Shrink pane to the left
bind -n S-Right resize-pane -R 5   # Expand pane to the right
bind -n S-Down resize-pane -D 5    # Shrink pane downward
bind -n S-Up resize-pane -U 5      # Expand pane upward

set -g mouse on
set -g status on

# Status_bar
set -g allow-rename off
set -g automatic-rename off
set -g status-style 'bg=default,fg=black,bright'
set -g status-left ''
set -g status-right ''

set -g status-justify centre
set -g window-status-separator " "
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-style "bg=brightblack,fg=white"
set -g window-status-bell-style "bg=red,fg=black"
set -g window-status-current-style "#{?window_zoomed_flag,bg=yellow,bg=magenta},fg=black,bold"
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

